<!DOCTYPE html>
<!--
  photomatch Studio: the page loaded in the Studio iframe (frontend/src/components/studio/Studio.jsx).
  Layout markup adapted from miniPaint's index.html (https://github.com/viliusle/miniPaint, MIT,
  Copyright (c) ViliusL; see MINIPAINT-LICENSE.txt). minipaint.js is built by tools/studio/build.mjs
  from miniPaint v4.14.3 plus our bridge (tools/studio/entry.js). Docs: docs/STUDIO.md.
-->
<html dir="ltr" lang="en-US">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="robots" content="noindex" />
	<title>photomatch Studio</title>
	<style>
		html, body { background: #0d0d0d; color: #f3f3f3; }
		.studio-boot { position: fixed; inset: 0; display: grid; place-items: center; font: 600 14px Inter, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #a8a8a8; }
		.studio-ready .studio-boot { display: none; }
	</style>
	<script src="minipaint.js"></script>
</head>
<body>
	<div class="studio-boot" aria-hidden="true">Opening Studio…</div>
	<div class="wrapper">

		<nav aria-label="Main Menu" class="main_menu" id="main_menu"></nav>

		<div class="submenu">
			<span class="pm-wordmark" aria-hidden="true">photo<b>match</b><small>Studio</small></span>
			<a class="logo" href="#" tabindex="-1" aria-hidden="true">miniPaint</a>
			<div class="block attributes" id="action_attributes"></div>
			<button class="undo_button" id="undo_button" type="button">
				<span class="sr_only">Undo</span>
			</button>
		</div>

		<div class="sidebar_left" id="tools_container"></div>

		<div class="middle_area" id="middle_area">

			<canvas class="ruler_left" id="ruler_left" aria-hidden="true"></canvas>
			<canvas class="ruler_top" id="ruler_top" aria-hidden="true"></canvas>

			<div class="main_wrapper" id="main_wrapper">
				<div class="canvas_wrapper" id="canvas_wrapper">
					<div id="mouse"></div>
					<div class="transparent-grid" id="canvas_minipaint_background"></div>
					<canvas id="canvas_minipaint" role="img" aria-label="Image canvas">
						<div class="trn error">
							Your browser does not support canvas or JavaScript is not enabled.
						</div>
					</canvas>
				</div>
			</div>
		</div>

		<div class="sidebar_right">
			<div class="preview block">
				<h2 class="trn toggle" data-target="toggle_preview">Preview</h2>
				<div id="toggle_preview"></div>
			</div>

			<div class="colors block">
				<h2 class="trn toggle" data-target="toggle_colors">Colors</h2>
				<div class="content" id="toggle_colors"></div>
			</div>

			<div class="block" id="info_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_info">Information</h2>
				<div class="content" id="toggle_info"></div>
			</div>

			<div class="details block" id="details_base">
				<h2 class="trn toggle toggle-full" data-target="toggle_details">Layer details</h2>
				<div class="content details-content" id="toggle_details"></div>
			</div>

			<div class="layers block">
				<h2 class="trn">Layers</h2>
				<div class="content" id="layers_base"></div>
			</div>
		</div>
	</div>
	<div class="mobile_menu">
		<button class="left_mobile_menu" id="left_mobile_menu_button" type="button">
			<span class="sr_only">Tools</span>
		</button>
		<button class="right_mobile_menu" id="mobile_menu_button" type="button">
			<span class="sr_only">Layers and colors</span>
		</button>
	</div>
	<div class="hidden" id="tmp"></div>
	<div id="popups"></div>
</body>
</html>
